<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Arena Survival</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <!-- The Game Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- UI Overlay -->
        <div id="ui-layer">
            <!-- HUD -->
            <div id="hud" class="hidden">
                <div class="top-bar">
                    <div class="xp-bar-container">
                        <div id="xp-bar"></div>
                    </div>
                    <div class="level-indicator">Lvl <span id="level-display">1</span></div>
                    <button id="toggle-sound-btn" class="glow-btn" style="padding: 5px 10px; font-size: 0.8rem; border-color: var(--neon-yellow); color: var(--neon-yellow);">🔊 ON</button>
                </div>
                <div class="stats-bar">
                    <div class="health-container">
                        <div id="health-bar"></div>
                    </div>
                    <div class="score-indicator">Score: <span id="score-display">0</span></div>
                    <div class="time-indicator" id="time-display">00:00</div>
                </div>
            </div>

            <!-- Start Screen -->
            <div id="start-screen" class="panel">
                <h1>NEON SURVIVAL</h1>
                <p>Use WASD or Arrow Keys to move. Auto-fire activates when enemies are near.</p>
                <div style="margin-bottom: 20px;">
                    <button id="show-achievements-btn" class="glow-btn" style="border-color: var(--neon-purple); color: var(--neon-purple); padding: 10px 20px; font-size: 1rem;">ACHIEVEMENTS</button>
                </div>
                <div id="level-select-grid" class="upgrades-grid" style="flex-wrap: wrap; justify-content: center;">
                    <!-- dynamically injected levels -->
                </div>
            </div>

            <!-- Achievements Screen -->
            <div id="achievements-screen" class="panel hidden">
                <h2 style="color: var(--neon-purple); text-shadow: 0 0 15px var(--neon-purple);">ACHIEVEMENTS</h2>
                <div id="achievements-list" style="display: flex; flex-direction: column; width: 100%; max-height: 400px; overflow-y: auto; gap: 10px;">
                    <!-- dynamically injected achievements -->
                </div>
                <button id="close-achievements-btn" class="glow-btn" style="margin-top:20px;">BACK</button>
            </div>

            <!-- Level Up Screen -->
            <div id="level-up-screen" class="panel hidden">
                <h2>LEVEL UP!</h2>
                <p>Choose an upgrade:</p>
                <div id="upgrades-container" class="upgrades-grid">
                    <!-- Upgrade cards generated dynamically -->
                </div>
            </div>

            <!-- Victory Screen -->
            <div id="victory-screen" class="panel hidden">
                <h2 class="text-success">SYSTEM PURGED</h2>
                <p>Level Cleared!</p>
                <p>Score: <span id="victory-score">0</span></p>
                <div style="display: flex; gap: 20px; margin-top: 20px;">
                    <button id="victory-menu-btn" class="glow-btn" style="border-color: var(--neon-yellow); color: var(--neon-yellow);">MAIN MENU</button>
                    <button id="next-level-btn" class="glow-btn" style="border-color: var(--neon-green); color: var(--neon-green);">NEXT LEVEL</button>
                </div>
            </div>

            <!-- Pause Screen -->
            <div id="pause-screen" class="panel hidden">
                <h2 style="color: var(--neon-yellow); text-shadow: 0 0 15px var(--neon-yellow);">PAUSED</h2>
                <p>Press ESC to Resume</p>
                <div style="display: flex; gap: 20px; margin-top: 20px;">
                    <button id="resume-btn" class="glow-btn" style="border-color: var(--neon-blue); color: var(--neon-blue);">RESUME</button>
                    <button id="quit-btn" class="glow-btn" style="border-color: var(--neon-red); color: var(--neon-red);">QUIT TO MENU</button>
                </div>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="panel hidden">
                <h2 class="text-danger">WASTED</h2>
                <p>Survival Time: <span id="final-time">00:00</span></p>
                <p>Score: <span id="final-score">0</span></p>
                <button id="restart-btn" class="glow-btn">REBOOT</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
