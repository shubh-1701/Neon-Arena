<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Protocol</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="crt"></div>
    <div id="game-container">
        <!-- The Game Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- UI Overlay -->
        <div id="ui-layer">
            <!-- HUD -->
            <div id="hud" class="hidden">
                <div class="top-bar">
                    <div class="xp-bar-container">
                        <div id="xp-bar"></div>
                    </div>
                    <div class="level-indicator">Lvl <span id="level-display">1</span></div>
                    <button id="toggle-sound-btn" class="glow-btn" style="padding: 5px 10px; font-size: 0.8rem; border-color: var(--neon-yellow); color: var(--neon-yellow);">🔊 ON</button>
                </div>
                <div class="stats-bar">
                    <div class="health-container">
                        <div id="health-bar"></div>
                    </div>
                    <div class="score-indicator">Score: <span id="score-display">0</span></div>
                    <div class="time-indicator" id="time-display">00:00</div>
                </div>
            </div>

            <!-- Start Screen -->
            <div id="start-screen" class="panel">
                <h1 class="glitch" data-text="TERMINAL PROTOCOL">TERMINAL PROTOCOL</h1>
                <p>Initialize Node with WASD. Auto-execute subroutine active.</p>
                <div style="margin-bottom: 20px;">
                    <button id="show-achievements-btn" class="glow-btn">DATABANKS</button>
                </div>
                <div id="level-select-grid" class="upgrades-grid" style="flex-wrap: wrap; justify-content: center;">
                    <!-- dynamically injected levels -->
                </div>
            </div>

            <!-- Achievements Screen -->
            <div id="achievements-screen" class="panel hidden">
                <h2>DATABANKS</h2>
                <div id="achievements-list" style="display: flex; flex-direction: column; width: 100%; max-height: 400px; overflow-y: auto; gap: 10px;">
                    <!-- dynamically injected achievements -->
                </div>
                <button id="close-achievements-btn" class="glow-btn" style="margin-top:20px;">BACK</button>
            </div>

            <!-- Level Up Screen -->
            <div id="level-up-screen" class="panel hidden">
                <h2>LEVEL UP!</h2>
                <p>Choose an upgrade:</p>
                <div id="upgrades-container" class="upgrades-grid">
                    <!-- Upgrade cards generated dynamically -->
                </div>
            </div>

            <!-- Victory Screen -->
            <div id="victory-screen" class="panel hidden">
                <h2 class="text-success">ACCESS GRANTED</h2>
                <p>Node Cleared!</p>
                <p>Data Extracted: <span id="victory-score">0</span></p>
                <div style="display: flex; gap: 20px; margin-top: 20px;">
                    <button id="victory-menu-btn" class="glow-btn">DISCONNECT</button>
                    <button id="next-level-btn" class="glow-btn">NEXT NODE</button>
                </div>
            </div>

            <!-- Pause Screen -->
            <div id="pause-screen" class="panel hidden">
                <h2>PROCESS SUSPENDED</h2>
                <p>Press ESC to Resume</p>
                <div style="display: flex; gap: 20px; margin-top: 20px;">
                    <button id="resume-btn" class="glow-btn">RESUME</button>
                    <button id="quit-btn" class="glow-btn text-danger">DISCONNECT</button>
                </div>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="panel hidden">
                <h2 class="text-danger">CONNECTION LOST</h2>
                <p>Survive Time: <span id="final-time">00:00</span></p>
                <p>Data Extracted: <span id="final-score">0</span></p>
                <button id="restart-btn" class="glow-btn text-success" style="margin-top: 20px;">REBOOT</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
